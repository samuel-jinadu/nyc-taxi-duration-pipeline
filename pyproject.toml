[project]
name = "taxi-longest-trip"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "SQLAlchemy>=2.1.4"
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "ruff>=0.16.10",
    "dagruff>=1.0.0"
]
airflow-dev = [
    "apache-airflow==3.3.2"
]
test = [
    "pytest>=9.1.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]